<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodera HotelOps — Reklam (9:16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#05080F;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 50% 30%,#0B1322,#05080F)}
  canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:9/16;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
    padding:10px 14px;border-radius:999px;background:rgba(12,20,36,.82);border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);z-index:10;font-size:13px;color:#cdd8ea}
  #bar button{appearance:none;border:none;cursor:pointer;font:inherit;color:#0a1322;font-weight:600;
    background:linear-gradient(135deg,#2FE6B0,#3E78D8);border-radius:999px;padding:9px 16px;display:flex;align-items:center;gap:7px;transition:transform .12s,filter .12s}
  #bar button:hover{filter:brightness(1.08);transform:translateY(-1px)}
  #bar button.ghost{background:rgba(255,255,255,.07);color:#cdd8ea}
  #bar button:disabled{opacity:.5;cursor:default;transform:none;filter:none}
  #tlabel{font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace;color:#8395b3;min-width:84px;text-align:center}
  #ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;background:rgba(5,8,15,.86);backdrop-filter:blur(6px);color:#eaf1fb}
  #ov.show{display:flex}
  #ov .ring{width:74px;height:74px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#2FE6B0;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #ov .pct{font:700 30px Sora,sans-serif;font-variant-numeric:tabular-nums}
  #ov .msg{font-size:15px;color:#9fb0cc;max-width:440px;text-align:center;line-height:1.5}
  #ov .pbar{width:320px;height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
  #ov .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2FE6B0,#3E78D8);border-radius:4px;transition:width .15s}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="play" class="ghost">❚❚ Duraklat</button>
  <button id="restart">↺</button>
  <span id="tlabel">0.0 / 60.0s</span>
  <button id="dl">⬇ MP4 indir</button>
</div>
<div id="ov"><div class="ring"></div><div class="pct">0%</div><div class="pbar"><i></i></div><div class="msg">Video kodlanıyor… Bu pencere açık kalsın.</div></div>
<script>window.NODERA_CFG={canvasId:'c',W:1080,H:1920,portrait:true,chrome:true,autoplay:true,loop:true};</script>
<script src="nodera-engine.js"></script>
</body>
</html>
